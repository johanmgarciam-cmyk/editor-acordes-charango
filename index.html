<script>

// ============================
// CONFIGURACIÓN BASE
// ============================

let activePositions = {};

// ============================
// BIBLIOTECA OFICIAL (EJEMPLO C MAYOR)
// REEMPLAZAR CON LAS FORMAS EXACTAS DEL LIBRO
// ============================

const chordLibrary = {

  "C": {
    tipo: "Mayor",
    posiciones: [

      {
        numero: 1,
        inversion: "Fundamental",
        bajo: "C",
        shape: "0-0|1-0|2-0|3-3|4-0"
      },

      {
        numero: 2,
        inversion: "1ra inversión",
        bajo: "E",
        shape: "0-3|1-3|2-4|3-5|4-3"
      },

      {
        numero: 3,
        inversion: "2da inversión",
        bajo: "G",
        shape: "0-8|1-8|2-7|3-8|4-X"
      },

      {
        numero: 4,
        inversion: "Octava superior",
        bajo: "C",
        shape: "0-12|1-12|2-12|3-12|4-X"
      }

    ]
  }

};

// ============================
// ACTIVAR TRATES
// ============================

function toggleNote(string, fret, element){

  // Limpiar esa cuerda
  document.querySelectorAll(`.string-${string}`).forEach(el=>{
    el.classList.remove("active");
  });

  element.classList.add("active");
  activePositions[string] = fret;

  validateChord();
}

// ============================
// GENERAR CÓDIGO DE POSICIÓN
// ============================

function generateShapeCode(){

  let code = [];

  for(let s=0; s<5; s++){

    if(activePositions[s] !== undefined){
      code.push(`${s}-${activePositions[s]}`);
    } else {
      code.push(`${s}-0`);
    }

  }

  return code.join("|");
}

// ============================
// VALIDAR CONTRA BIBLIOTECA
// ============================

function validateChord(){

  const currentShape = generateShapeCode();

  for(let chordName in chordLibrary){

    let chord = chordLibrary[chordName];

    for(let pos of chord.posiciones){

      if(currentShape === pos.shape){

        document.getElementById("result").innerHTML = `
          <b>Acorde:</b> ${chordName} ${chord.tipo}<br>
          <b>Posición:</b> ${pos.numero}<br>
          <b>Inversión:</b> ${pos.inversion}<br>
          <b>Bajo:</b> ${pos.bajo}
        `;

        return;
      }
    }
  }

  document.getElementById("result").innerHTML =
    "No corresponde a biblioteca oficial";

}

// ============================
// SONIDO
// ============================

const noteNames = ["C","C#","D","D#","E","F","F#","G","G#","A","A#","B"];

const tuning = [7,0,4,9,4]; // G C E A E

function getFrequency(noteIndex){
  return 440 * Math.pow(2, (noteIndex - 9)/12);
}

function playChord(){

  const ctx = new (window.AudioContext || window.webkitAudioContext)();

  for(let s=0; s<5; s++){

    let fret = activePositions[s] ?? 0;
    let noteIndex = (tuning[s] + fret) % 12;
    let frequency = getFrequency(noteIndex);

    let osc = ctx.createOscillator();
    osc.type = "triangle";
    osc.frequency.value = frequency;

    let gain = ctx.createGain();
    gain.gain.setValueAtTime(0.3, ctx.currentTime);
    gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + 1);

    osc.connect(gain);
    gain.connect(ctx.destination);

    osc.start();
    osc.stop(ctx.currentTime + 1);
  }
}

</script>
