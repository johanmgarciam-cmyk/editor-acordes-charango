<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Editor de Acordes de Charango</title>
  <style>
    body { font-family: Arial, sans-serif; margin: 0; background: #f4f4f4; }
    header { background: #2f5d50; color: white; padding: 12px; text-align: center; }
    .container { padding: 12px; }
    .charango { display: grid; grid-template-columns: repeat(19, 1fr); gap: 4px; overflow-x: auto; }
    .cell { background: white; border: 1px solid #ccc; text-align: center; padding: 6px; font-size: 11px; cursor: pointer; }
    .cell.active { background: #ffd966; border-color: #c9a400; }
    .info { background: white; padding: 10px; border-radius: 6px; margin: 10px 0; }
    input, button { padding: 8px; width: 100%; margin-top: 6px; }
  </style>
</head>
<body>
<header>
  <h1>Editor de Acordes de Charango</h1>
  <p>Constructor interactivo de posiciones reales</p>
</header>

<div class="container">
  <div class="info">
    <strong>Afinación estándar:</strong><br>
    5ª G4 · 4ª C5 · 3ª E4/E5 (octavada) · 2ª A4 · 1ª E5
  </div>

  <div id="charango" class="charango"></div>

  <div class="info">
    <strong>Notas seleccionadas:</strong>
    <ul id="selectedNotes"></ul>
  </div>

  <div class="info">
    <input id="chordName" placeholder="Nombre del acorde" />
    <button onclick="playChord()">Escuchar acorde</button>
    <button onclick="saveChord()">Guardar acorde</button>
  </div>

  <div class="info">
    <strong>Acordes guardados</strong>
    <pre id="saved"></pre>
  </div>
</div>

<script>
  const notes = ['C','C#','D','D#','E','F','F#','G','G#','A','A#','B'];
  const frets = 18;

  const tuning = [
    { name: 'G', freqs: [391.99] },
    { name: 'C', freqs: [523.25] },
    { name: 'E', freqs: [329.63, 659.25] }, // 3ª cuerda octavada
    { name: 'A', freqs: [440.00] },
    { name: 'E', freqs: [659.25] }
  ];

  const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
  const selected = [];
  const charangoDiv = document.getElementById('charango');

  function noteAt(stringIndex, fret) {
    const baseIndex = notes.indexOf(tuning[stringIndex].name);
    return notes[(baseIndex + fret) % 12];
  }

  function freqsAt(stringIndex, fret) {
    return tuning[stringIndex].freqs.map(f => f * Math.pow(2, fret / 12));
  }

  tuning.forEach((string, s) => {
    for (let f = 0; f <= frets; f++) {
      const cell = document.createElement('div');
      cell.className = 'cell';
      const note = noteAt(s, f);
      cell.innerHTML = `Ord ${5 - s}<br>T${f}<br>${note}`;
      cell.onclick = () => toggleCell(cell, s, f, note);
      charangoDiv.appendChild(cell);
    }
  });

  function toggleCell(cell, s, f, note) {
    const idx = selected.findIndex(n => n.s === s && n.f === f);
    if (idx >= 0) {
      selected.splice(idx, 1);
      cell.classList.remove('active');
    } else {
      selected.push({ s, f, note });
      cell.classList.add('active');
      playFreqs(freqsAt(s, f));
    }
    renderSelected();
  }

  function renderSelected() {
    const ul = document.getElementById('selectedNotes');
    ul.innerHTML = '';
    selected.forEach(n => {
      const li = document.createElement('li');
      li.textContent = `Orden ${5 - n.s}, traste ${n.f} → ${n.note}`;
      ul.appendChild(li);
    });
  }

  function playFreqs(freqs) {
    freqs.forEach(freq => {
      const osc = audioCtx.createOscillator();
      osc.type = 'sine';
      osc.frequency.value = freq;
      osc.connect(audioCtx.destination);
      osc.start();
      osc.stop(audioCtx.currentTime + 0.6);
    });
  }

  function playChord() {
    selected.forEach(n => playFreqs(freqsAt(n.s, n.f)));
  }

  function saveChord() {
    const name = document.getElementById('chordName').value || 'Sin nombre';
    const data = { name, positions: selected };
    const saved = JSON.parse(localStorage.getItem('charangoChords') || '[]');
    saved.push(data);
    localStorage.setItem('charangoChords', JSON.stringify(saved, null, 2));
    document.getElementById('saved').textContent = JSON.stringify(saved, null, 2);
    alert('Acorde guardado');
  }

  document.getElementById('saved').textContent = localStorage.getItem('charangoChords') || '';
</script>
</body>
</html>
