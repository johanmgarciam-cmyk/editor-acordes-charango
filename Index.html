<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Editor de Acordes Charango</title>

<style>
body {
    font-family: Arial, sans-serif;
    text-align: center;
    background: #f4f4f4;
}

h1 {
    margin-top: 20px;
}

#fretboard {
    display: flex;
    justify-content: center;
    margin-top: 30px;
    gap: 10px;
}

.string {
    display: flex;
    flex-direction: column-reverse;
    gap: 6px;
}

.fret {
    width: 35px;
    height: 35px;
    border: 1px solid #999;
    border-radius: 50%;
    background: white;
    cursor: pointer;
}

.fret.active {
    background: #2c3e50;
    color: white;
}

button {
    margin-top: 20px;
    padding: 10px 20px;
    font-size: 16px;
}
</style>
</head>

<body>

<h1>Editor de Acordes - Charango</h1>

<div id="fretboard"></div>

<button onclick="playChord()">Escuchar acorde</button>

<script src="app.js"></script>
</body>
</html>
